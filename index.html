<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phaser Aim Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
    </style>
</head>
<body>

<script>
let rect;
let score = 0;
let scoreText;
let timerText;
let debugMode = true;
let debugGraphics;

let levelTextBG;
let goalText;

let gameOver = false;
let inMenu = true;

let activeTargets = [];
let spawnTimer = null;
let elapsedMs = 0;

const MAX_ASSET_SIZE = 100;
const CURSOR_HITBOX_SIZE = 20;
const TARGET_HITBOX_SIZE = 300;
const MISS_CLICK_PENALTY = 1;
const EXPIRED_TARGET_PENALTY = 0.5;
const DEFAULT_CURSOR_ASSET = "white.png";
const DEFAULT_TARGET_ASSET = "red.png";

// -------------------------
// LEVEL DATA (Internal)
// -------------------------
const gameData = {
    "startLevel": "l1",
    "levels": {
        "l1": {
            "name": "The start",
            "goal": 3,
            "next": "l2",
            "scoreDelta": 1,
            "cooldown": 10,
            "missPenalty": 0.5,
            "expiredPenalty": 0.5,
            "cursorSize": 100,
            "targetSize": 100,
            "cursorHitboxSize": 20,
            "targetHitboxSize": 400,
            "movement": [],
            "assets": {
                "cursor": "assets/white.png",
                "targets": "assets/red.png"
            },
            "allowMultiple": null
        },
        "l2": {
            "name": "Get better :)",
            "goal": 5,
            "next": "null",
            "scoreDelta": 1,
            "cooldown": 3,
            "missPenalty": 1,
            "expiredPenalty": 0.5,
            "cursorSize": 100,
            "targetSize": 100,
            "cursorHitboxSize": 20,
            "targetHitboxSize": 400,
            "movement": [],
            "assets": {
                "cursor": "assets/white.png",
                "targets": "assets/red.png"
            },
            "allowMultiple": null
        }
    }
};

const levels = gameData.levels;

function getStartLevelKey() {
    if (gameData.startLevel && levels[gameData.startLevel]) {
        return gameData.startLevel;
    }
    return Object.keys(levels)[0] || null;
}

let currentLevelKey = getStartLevelKey();
let currentLevel = currentLevelKey ? levels[currentLevelKey] : null;

// -------------------------
// MOVEMENT SYSTEM
// -------------------------
const Movement = {
    linear(target, scene, config) {
        if(!config.paths) return;
        const path = Phaser.Utils.Array.GetRandom(config.paths);
        const data = {
            p1: path.p1, p2: path.p2,
            duration: path.time * 1000,
            t: 0, dir: 1
        };
        target.movementModules.push((dt) => {
            data.t += data.dir * dt;
            if (data.t >= data.duration) { data.t = data.duration; data.dir = -1; }
            if (data.t <= 0) { data.t = 0; data.dir = 1; }
            const ratio = data.t / data.duration;
            target.x = Phaser.Math.Linear(data.p1.x, data.p2.x, ratio);
            target.y = Phaser.Math.Linear(data.p1.y, data.p2.y, ratio);
        });
    },
    jitter(target, scene, config) {
        const { intensity = 3, speed = 0.02 } = config;
        const data = { time: 0, intensity, speed };
        target.movementModules.push((dt) => {
            data.time += dt * data.speed;
            target.x += Math.sin(data.time * 13.37) * data.intensity;
            target.y += Math.cos(data.time * 9.42) * data.intensity;
        });
    }
};

function toNumberOrFallback(value, fallback) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
}

function sanitizeAssetValue(value) {
    if (value == null) return "";
    const normalized = String(value).trim();
    if (!normalized) return "";

    const lowered = normalized.toLowerCase();
    if (lowered === "null" || lowered === "undefined" || lowered === "none") {
        return "";
    }

    return normalized;
}

function normalizeAssetPath(assetValue, fallback) {
    const value = sanitizeAssetValue(assetValue) || sanitizeAssetValue(fallback);
    if (!value) return "";
    if (value.includes("/") || value.startsWith("http://") || value.startsWith("https://")) {
        return value;
    }
    return "assets/" + value;
}

function getAssetKey(assetPath) {
    return "asset:" + assetPath;
}

function parseAssetEntry(entry, config) {
    if (typeof entry !== "string") return;

    const trimmed = sanitizeAssetValue(entry);
    if (!trimmed) return;

    if (!trimmed.includes("=")) {
        config.targets.push(trimmed);
        return;
    }

    const [rawRole, ...rest] = trimmed.split("=");
    const role = rawRole.trim().toLowerCase();
    const value = sanitizeAssetValue(rest.join("="));
    if (!value) return;

    if (role === "cursor") config.cursor = value;
    if (role === "target") config.targets.push(value);
}

function resolveLevelAssets(level) {
    const config = {
        cursor: DEFAULT_CURSOR_ASSET,
        targets: []
    };

    const rawAssets = level?.assets;

    if (Array.isArray(rawAssets)) {
        rawAssets.forEach(entry => parseAssetEntry(entry, config));
    } else if (typeof rawAssets === "string") {
        rawAssets.split(",").forEach(entry => parseAssetEntry(entry, config));
    } else if (rawAssets && typeof rawAssets === "object") {
        const cursorAsset = sanitizeAssetValue(rawAssets.cursor);
        if (cursorAsset) config.cursor = cursorAsset;
        if (Array.isArray(rawAssets.targets)) config.targets.push(...rawAssets.targets);
        if (typeof rawAssets.targets === "string") config.targets.push(rawAssets.targets);
        if (rawAssets.target) config.targets.push(rawAssets.target);
    }

    config.targets = [...new Set(config.targets.map(asset => sanitizeAssetValue(asset)).filter(Boolean))];
    if (!config.targets.length) config.targets = [DEFAULT_TARGET_ASSET];

    return config;
}

function collectAssetManifest(levelMap) {
    const manifest = new Map();

    Object.values(levelMap).forEach(level => {
        const assets = resolveLevelAssets(level);
        [assets.cursor, ...assets.targets].forEach(assetName => {
            const path = normalizeAssetPath(assetName, "");
            if (!path || manifest.has(path)) return;
            manifest.set(path, getAssetKey(path));
        });
    });

    return manifest;
}

function getCurrentCursorAssetKey() {
    const assets = resolveLevelAssets(currentLevel);
    return getAssetKey(normalizeAssetPath(assets.cursor, DEFAULT_CURSOR_ASSET));
}

function getRandomTargetAssetKey() {
    const assets = resolveLevelAssets(currentLevel);
    const assetName = Phaser.Utils.Array.GetRandom(assets.targets);
    return getAssetKey(normalizeAssetPath(assetName, DEFAULT_TARGET_ASSET));
}

function getCursorAssetSize(level = currentLevel) {
    return toNumberOrFallback(level?.cursorSize, MAX_ASSET_SIZE);
}

function getTargetAssetSize(level = currentLevel) {
    return toNumberOrFallback(level?.targetSize, MAX_ASSET_SIZE);
}

function getCursorHitboxSize(level = currentLevel) {
    return toNumberOrFallback(level?.cursorHitboxSize, CURSOR_HITBOX_SIZE);
}

function getTargetHitboxSize(level = currentLevel) {
    return toNumberOrFallback(level?.targetHitboxSize, TARGET_HITBOX_SIZE);
}

function getMissClickPenalty(level = currentLevel) {
    return toNumberOrFallback(level?.missPenalty, MISS_CLICK_PENALTY);
}

function getExpiredTargetPenalty(level = currentLevel) {
    return toNumberOrFallback(level?.expiredPenalty, EXPIRED_TARGET_PENALTY);
}

function getScoreDelta(level = currentLevel) {
    return toNumberOrFallback(level?.scoreDelta, 1);
}

function startGame() {
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#111111',
        scene: { preload, create, update }
    };
    new Phaser.Game(config);
}

function preload() {
    collectAssetManifest(levels).forEach((key, path) => {
        this.load.image(key, path);
    });
}

function fitImageToMaxSize(image, maxSize = MAX_ASSET_SIZE) {
    const frame = image.frame;
    const scale = Math.min(maxSize / frame.width, maxSize / frame.height);
    image.setScale(scale);
    return image;
}

function getCenteredHitbox(sprite, size) {
    return new Phaser.Geom.Rectangle(
        sprite.x - size / 2,
        sprite.y - size / 2,
        size,
        size
    );
}

function formatScore(value) {
    return Number.isInteger(value) ? String(value) : value.toFixed(1);
}

function formatElapsedTime(milliseconds) {
    return (milliseconds / 1000).toFixed(1) + "s";
}

function updateScoreDisplay() {
    scoreText.setText("Score: " + formatScore(score));
}

function updateTimerDisplay() {
    timerText.setText("Time: " + formatElapsedTime(elapsedMs));
}

function applyCursorAsset() {
    rect.setTexture(getCurrentCursorAssetKey());
    fitImageToMaxSize(rect, getCursorAssetSize());
}

function create() {
    const w = this.scale.width;
    const h = this.scale.height;

    // GAME UI (Create these first but hide them)
    levelTextBG = this.add.text(w / 2, h / 2, formatLevelText(), {
        fontSize: "120px", color: "#555", fontStyle: "bold", align: "center"
    }).setOrigin(0.5).setAlpha(0.15).setDepth(0).setVisible(false);

    goalText = this.add.text(w - 40, 20, "🏁 Goal: " + currentLevel.goal, {
        fontSize: "32px", color: "#ffffff"
    }).setOrigin(1, 0).setDepth(9999).setVisible(false);

    scoreText = this.add.text(20, 20, "Score: 0", {
        fontSize: "32px", color: "#ffffff"
    }).setDepth(9999).setVisible(false);

    timerText = this.add.text(w / 2, 20, "Time: 0.0s", {
        fontSize: "32px", color: "#ffffff"
    }).setOrigin(0.5, 0).setDepth(9999).setVisible(false);

    rect = this.add.image(w / 2, h / 2, getCurrentCursorAssetKey())
        .setDepth(9999)
        .setVisible(false);
    applyCursorAsset();

    // MENU SCREEN
    this.menuContainer = this.add.container(w / 2, h / 2);
    const title = this.add.text(0, -120, "AIM TRAINER", { fontSize: "72px", color: "#ffffff", fontStyle: "bold" }).setOrigin(0.5);
    const playButton = this.add.text(0, 80, "PLAY", {
        fontSize: "48px", color: "#00ff88", fontStyle: "bold", backgroundColor: "#003322", padding: { x: 20, y: 10 }
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    playButton.on("pointerdown", () => {
        this.menuContainer.setVisible(false);
        inMenu = false;
        elapsedMs = 0;
        updateTimerDisplay();
        setupSpawning(this);
    });
    this.menuContainer.add([title, playButton]);

    if (debugMode) {
        debugGraphics = this.add.graphics().setDepth(9999);
    }

    // CONTROLS
    this.input.on("pointermove", (pointer) => {
        if (!this.input.mouse.locked || inMenu || gameOver) return;
        rect.x += pointer.movementX;
        rect.y += pointer.movementY;
    });

    this.input.on("pointerdown", () => {
        if (inMenu || gameOver) return;
        if (!this.input.mouse.locked) {
            this.input.mouse.requestPointerLock();
            return;
        }

        const cursorBounds = getCenteredHitbox(rect, getCursorHitboxSize());
        let hitTarget = false;
        for (let i = activeTargets.length - 1; i >= 0; i--) {
            const t = activeTargets[i];
            const targetBounds = getCenteredHitbox(t, getTargetHitboxSize());
            if (Phaser.Geom.Intersects.RectangleToRectangle(cursorBounds, targetBounds)) {
                hitTarget = true;
                t.destroy();
                activeTargets.splice(i, 1);
                score += getScoreDelta();
                updateScoreDisplay();
                if (!currentLevel.allowMultiple && !gameOver) spawnTarget(this);
                checkLevelProgress(this);
                break;
            }
        }

        if (!hitTarget) {
            score -= getMissClickPenalty();
            updateScoreDisplay();
        }
    });
}

function update() {
    if (inMenu || gameOver) return;

    rect.setVisible(true);
    scoreText.setVisible(true);
    timerText.setVisible(true);
    goalText.setVisible(true);
    levelTextBG.setVisible(true);

    const w = this.scale.width;
    const h = this.scale.height;

    if (rect.x < 0) rect.x = w;
    if (rect.x > w) rect.x = 0;
    if (rect.y < 0) rect.y = h;
    if (rect.y > h) rect.y = 0;

    const dt = this.game.loop.delta;
    elapsedMs += dt;
    updateTimerDisplay();
    activeTargets.forEach(t => {
        if (t.movementModules) t.movementModules.forEach(fn => fn(dt));
    });
}

function setupSpawning(scene) {
    if (spawnTimer) spawnTimer.remove();
    activeTargets.forEach(t => t.destroy());
    activeTargets = [];

    const multi = currentLevel.allowMultiple;
    if (multi) {
        spawnTarget(scene);
        spawnTimer = scene.time.addEvent({
            delay: multi.interval,
            loop: true,
            callback: () => {
                if (!gameOver && activeTargets.length < multi.maxAmount) spawnTarget(scene);
            }
        });
    } else {
        spawnTarget(scene);
    }
}

function spawnTarget(scene) {
    if (gameOver || inMenu) return;
    const margin = 100;
    const x = Phaser.Math.Between(margin, scene.scale.width - margin);
    const y = Phaser.Math.Between(margin, scene.scale.height - margin);

    const t = scene.add.image(x, y, getRandomTargetAssetKey());
    fitImageToMaxSize(t, getTargetAssetSize());
    t.movementModules = [];

    if (currentLevel.movement) {
        const moves = Array.isArray(currentLevel.movement) ? currentLevel.movement : [currentLevel.movement];
        moves.forEach(m => Movement[m.type](t, scene, m));
    }

    activeTargets.push(t);
    scene.time.delayedCall((currentLevel.cooldown || 3) * 1000, () => {
        if (!gameOver && t.active) {
            t.destroy();
            Phaser.Utils.Array.Remove(activeTargets, t);
            score -= getExpiredTargetPenalty();
            updateScoreDisplay();
            if (!currentLevel.allowMultiple && !gameOver) spawnTarget(scene);
        }
    });
}

function checkLevelProgress(scene) {
    if (score >= currentLevel.goal) {
        if (currentLevel.next && levels[currentLevel.next]) {
            currentLevelKey = currentLevel.next;
            currentLevel = levels[currentLevelKey];
            score = 0;
            applyCursorAsset();
            updateScoreDisplay();
            levelTextBG.setText(formatLevelText());
            goalText.setText("🏁 Goal: " + currentLevel.goal);
            setupSpawning(scene);
        } else {
            showEndScreen(scene);
        }
    }
}

function formatLevelText() {
    return currentLevel ? currentLevel.name.toUpperCase() : "GAME";
}

function showEndScreen(scene) {
    gameOver = true;
    activeTargets.forEach(t => t.destroy());
    if (scene.input.mouse.locked) scene.input.mouse.releasePointerLock();
    scene.add.text(scene.scale.width / 2, scene.scale.height / 2, "🏆 TRAINING COMPLETE", {
        fontSize: "64px", color: "#ffffff", fontStyle: "bold"
    }).setOrigin(0.5);
    scene.add.text(scene.scale.width / 2, scene.scale.height / 2 + 70, "Final Time: " + formatElapsedTime(elapsedMs), {
        fontSize: "32px", color: "#ffffff"
    }).setOrigin(0.5);
}

window.onload = startGame;
</script>

</body>
</html>
